<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handmade Crochet - Business</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Crochet Gems</div>
            <button id="theme-toggle">Toggle Dark Mode</button>
        </nav>
    </header>

    <main>
        <section id="about">
            <h1>Our Story</h1>
            <p>Welcome to our crochet studio. We specialize in handmade, sustainable fashion...</p>
            <span id="more-text" class="hidden">Our journey began with a single hook and a ball of yarn. Today, we create intricate patterns that bring warmth to your home.</span>
            <button id="read-more-btn">Read More</button>
        </section>

        <section id="contact">
            <h2>Custom Orders & Inquiries</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Describe your custom piece..."></textarea>
                <button type="submit">Send to Database</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
