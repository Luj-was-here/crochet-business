<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crochet Business</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="theme-toggle">Toggle Dark Mode</button>
    </header>

    <main>
        <h1>Handmade Crochet Shop</h1>
        <p>We create beautiful, hand-hooked items. 
            <span id="more-text" style="display:none;"> Every piece is made with sustainable materials and supports local artisans in our community.</span>
            <button id="read-more-btn">Read More</button>
        </p>

        <section id="contact">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <input type="text" id="userName" placeholder="Name" required>
                <input type="email" id="userEmail" placeholder="Email" required>
                <button type="submit">Submit to Database</button>
            </form>
        </section>

        <section id="admin">
            <h3>Stored Database Records</h3>
            <ul id="db-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
